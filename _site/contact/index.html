    <script>
      // Open links in .post-content (blog posts) in a new tab
      document.addEventListener('DOMContentLoaded', function() {
        const header = document.querySelector('header');
        let lastScrollY = window.scrollY;
        let ticking = false;

        const updateHeader = () => {
          const currentScrollY = window.scrollY;
          const isScrollingDown = currentScrollY > lastScrollY;
          const shouldHide = isScrollingDown && currentScrollY > 80;
          if (header) {
            if (currentScrollY <= 10) {
              header.classList.remove('header-hidden');
            } else {
              header.classList.toggle('header-hidden', shouldHide);
            }
          }
          lastScrollY = currentScrollY;
          ticking = false;
        };

        window.addEventListener('scroll', () => {
          if (!ticking) {
            window.requestAnimationFrame(updateHeader);
            ticking = true;
          }
        });

        const postLinks = document.querySelectorAll('.post-content a');
        postLinks.forEach(link => {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer'); // Security and accessibility
        });

        // Optional: Open links in .project-content (projects) in a new tab
        const projectLinks = document.querySelectorAll('.project-content a');
        projectLinks.forEach(link => {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer'); // Security and accessibility
        });

        const writingSections = document.querySelectorAll('[data-writing]');
        writingSections.forEach(section => {
          const sortButtons = section.querySelectorAll('[data-sort]');
          const searchInput = section.querySelector('[data-search]');
          const list = section.querySelector('.writing-list');
          const items = Array.from(section.querySelectorAll('[data-item]'));
          const emptyState = section.querySelector('[data-empty]');
          if (!items.length || !list) {
            return;
          }

          const activeButton = section.querySelector('.filter-btn.is-active');
          let activeSort = activeButton ? activeButton.dataset.sort : 'newest';

          const setActiveSort = nextSort => {
            activeSort = nextSort;
            sortButtons.forEach(button => {
              const isActive = button.dataset.sort === activeSort;
              button.classList.toggle('is-active', isActive);
              button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });
          };

          const sortItems = () => {
            const sorted = items.slice().sort((a, b) => {
              const dateA = Number(a.dataset.date) || 0;
              const dateB = Number(b.dataset.date) || 0;
              return activeSort === 'oldest' ? dateA - dateB : dateB - dateA;
            });
            sorted.forEach(item => list.appendChild(item));
          };

          const applyFilters = () => {
            const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
            let visibleCount = 0;
            items.forEach(item => {
              const haystack = `${item.dataset.title || ''} ${item.dataset.excerpt || ''} ${item.dataset.tags || ''}`;
              const isVisible = !query || haystack.includes(query);
              item.hidden = !isVisible;
              if (isVisible) {
                visibleCount += 1;
              }
            });
            sortItems();
            if (emptyState) {
              emptyState.hidden = visibleCount !== 0;
            }
          };

          sortButtons.forEach(button => {
            button.addEventListener('click', () => {
              setActiveSort(button.dataset.sort || 'newest');
              applyFilters();
            });
          });

          if (searchInput) {
            searchInput.addEventListener('input', applyFilters);
          }

          setActiveSort(activeSort);
          applyFilters();
        });
      });
    </script>
