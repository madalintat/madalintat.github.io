<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | cetusian</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <!-- Classic .ico favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico" />
    <!-- PNG favicons for different sizes -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon_io/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon_io/favicon-32x32.png"
    />
    <!-- For Apple devices -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon_io/apple-touch-icon.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <header>
      <a href="/" class="logo">cetusian</a>
      <nav>
        <ul>
          <li><a href="/" >home</a></li>
          <li><a href="/about/" >about</a></li>
          <li><a href="/projects/" >projects</a></li>
          <li><a href="/blog/" >blog</a></li>
          <li><a href="/contact/" class="active">contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="content"><section class="section">
  <h2>contact</h2>
  <p>get in touch about ai, research, or ideas.</p>

  <div class="social-links" style="justify-content: flex-start; margin: 2rem 0">
    <a href="https://x.com/cetusian" target="_blank" rel="noopener">> x</a>
    <a href="https://github.com/cetusian" target="_blank" rel="noopener">> github</a>
    <a href="https://huggingface.co/cetusian" target="_blank" rel="noopener">> huggingface</a>
  </div>

  <form
    class="contact-form"
    action="https://formspree.io/f/xanqrgvw"
    method="POST"
  >
    <div class="form-group">
      <label for="email">email</label>
      <input type="email" id="email" name="email" required />
    </div>
    <div class="form-group">
      <label for="message">message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <button type="submit" class="submit-btn">send</button>
  </form>
</section>
</main>

    <footer class="footer">
      <p>© 2025 cetusian.</p>
    </footer>

    <script>
      // Open links in .post-content (blog posts) in a new tab
      document.addEventListener('DOMContentLoaded', function() {
        const postLinks = document.querySelectorAll('.post-content a');
        postLinks.forEach(link => {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer'); // Security and accessibility
        });

        // Optional: Open links in .project-content (projects) in a new tab
        const projectLinks = document.querySelectorAll('.project-content a');
        projectLinks.forEach(link => {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer'); // Security and accessibility
        });
      });
    </script>
  </body>
</html>
