<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | cetusian</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <!-- Classic .ico favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico" />
    <!-- PNG favicons for different sizes -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon_io/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon_io/favicon-32x32.png"
    />
    <!-- For Apple devices -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon_io/apple-touch-icon.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <header>
      <a href="/" class="logo">cetusian</a>
      <nav>
        <ul>
          <li><a href="/" >home</a></li>
          <li><a href="/about/" >about</a></li>
          <li><a href="/projects/" >projects</a></li>
          <li><a href="/blog/" class="active">blog</a></li>
          <li><a href="/contact/" >contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="content"><section class="section">
  <h2>writing</h2>
  
  <div class="blog-card">
    <h3><a href="/blog/testpost/">PostTest</a></h3>
    <div class="date">March 03, 2025</div>
    <p><p>Testing blog post.</p>
</p>
    <a href="/blog/testpost/" class="read-more">Read more</a>
  </div>
  
</section>
</main>

    <footer class="footer">
      <p>© 2025 cetusian.</p>
    </footer>

    <script>
      // Open links in .post-content (blog posts) in a new tab
      document.addEventListener('DOMContentLoaded', function() {
        const postLinks = document.querySelectorAll('.post-content a');
        postLinks.forEach(link => {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer'); // Security and accessibility
        });

        // Optional: Open links in .project-content (projects) in a new tab
        const projectLinks = document.querySelectorAll('.project-content a');
        projectLinks.forEach(link => {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer'); // Security and accessibility
        });
      });
    </script>
  </body>
</html>
